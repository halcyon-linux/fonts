# ci/packages.toml — the fonts build registry + sweep-feed config.
#
# Consumed by ci/matrix.py (build selection) and ci/sweep/sweep.py (version
# sweep). One table per package; **a package without an entry is not built**.
# The specs themselves live in pkgs/<pkg>/<pkg>.spec.
#
# Batches are dependency levels, not parallel groups within one job:
# copr-build.yml submits the waves sequentially and waits for each wave's
# Copr builds before the next — each successful build is immediately visible
# to the project repo, so a package may rely on anything built in a lower
# batch. Packages inside one batch must therefore never depend on each other.
#
# All packages are batch 0: leaf font packages with no inter-dependencies
# (one submit wave).
# The optional [pkg.updates] table drives the daily sweep (update.yml):
#   feed = "github-release"  + repo = "owner/name"   latest GitHub release tag
#   feed = "github-tag"      + repo = "owner/name"   newest git tag
#   feed = "custom"          + custom = "<name>"     ci/sweep/custom.py function

# --------------------------------------------------------------- desktops

# --- batch 0 ------------------------------------------------------------
[nerd-fonts-jetbrainsmono]
batch = 0

[nerd-fonts-jetbrainsmono.updates]
feed = "github-release"
repo = "ryanoasis/nerd-fonts"

[nerd-fonts-ubuntu]
batch = 0

[nerd-fonts-ubuntu.updates]
feed = "github-release"
repo = "ryanoasis/nerd-fonts"

[nerd-fonts-ubuntu-mono]
batch = 0

[nerd-fonts-ubuntu-mono.updates]
feed = "github-release"
repo = "ryanoasis/nerd-fonts"

[nerd-fonts-symbols-only]
batch = 0

[nerd-fonts-symbols-only.updates]
feed = "github-release"
repo = "ryanoasis/nerd-fonts"

# jetbrains-mono-fonts-all: every static weight of JetBrains Mono and
# JetBrains Mono NL from the upstream release zip (one package, all
# families — the nerd-fonts one-package-per-family shape, "-all" flavor).
[jetbrains-mono-fonts-all]
batch = 0

[jetbrains-mono-fonts-all.updates]
feed = "github-release"
repo = "JetBrains/JetBrainsMono"

# google-noto-color-emoji-fonts: the official COLRv1 build vendored from
# google/fonts (upstream noto-emoji attaches no font assets to releases and
# tags carry no built font); version = the pinned google/fonts commit's
# date (custom_noto_color_emoji in ci/sweep/custom.py).
[google-noto-color-emoji-fonts]
batch = 0

[google-noto-color-emoji-fonts.updates]
feed = "custom"
custom = "noto-color-emoji"

# texlive rolling groups (batch 5): generated specs owned by the
# biweekly texlive roll (.github/workflows/texlive-update.yml);
# never swept by the Monday update.yml — no updates tables, the
# roll rewrites the specs wholesale.

